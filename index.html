<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - PC Parts Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Queen's Store</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#about">About</a></li>
    </ul>
  </nav>

  <!-- Section Home -->
  <section id="home" class="hero-section">
    <div class="hero-content">
      <h1>Welcome to Our Store! <span class="highlight">Happy Shopping :D</span></h1>
    </div>
  </section>

  <!-- Section Products / Collections -->
  <section id="products" class="products-section">
    <h2>Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="ipad.jpeg" alt="ipad">
        <p>Ipad</p>
      </div>
      <div class="product-card">
        <img src="celine.jpeg" alt="celine">
        <p>Tas Celine</p>
      </div>
      <div class="product-card">
        <img src="pocky.jpeg" alt="pocky">
        <p>Pocky</p>
      </div>
      <div class="product-card">
        <img src="smartwatch.jpeg" alt="smartwatch">
        <p>Smartwatch</p>
      </div>
    </div>
  </section>

  <!-- Section About -->
  <section id="about" class="about-section">
    <h2>About</h2>
    <p>₊˚⊹♡ Pretty things, happy hearts, and little moments of joy. Welcome to your new favorite corner, Queen’s Store! ୨୧</p>
  </section>

</body>
</html>
